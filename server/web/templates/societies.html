{{define "content"}}
<div class="fade-in">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Societies</h1>

  <!-- Filter tabs -->
  <div class="flex gap-1 mb-4 bg-white rounded-lg border border-gray-200 p-1 w-fit">
    <button onclick="filterSocieties('')" class="soc-filter-btn px-3 py-1.5 text-sm rounded-md bg-gray-100 text-gray-900 font-medium" data-filter="">All</button>
    <button onclick="filterSocieties('ACTIVE')" class="soc-filter-btn px-3 py-1.5 text-sm rounded-md text-gray-600" data-filter="ACTIVE">Active</button>
    <button onclick="filterSocieties('SUSPENDED')" class="soc-filter-btn px-3 py-1.5 text-sm rounded-md text-gray-600" data-filter="SUSPENDED">Suspended</button>
  </div>

  <div class="bg-white rounded-xl border border-gray-200">
    <div id="societies-list" class="divide-y divide-gray-100">
      <div class="p-8 text-center text-gray-400">Loading...</div>
    </div>
  </div>
</div>

<script>
async function filterSocieties(status) {
  document.querySelectorAll('.soc-filter-btn').forEach(btn => {
    btn.classList.toggle('bg-gray-100', btn.dataset.filter === status);
    btn.classList.toggle('text-gray-900', btn.dataset.filter === status);
    btn.classList.toggle('font-medium', btn.dataset.filter === status);
    btn.classList.toggle('text-gray-600', btn.dataset.filter !== status);
  });

  const url = status ? `/societies?status=${status}` : '/societies';
  const resp = await apiFetch(url);
  if (!resp) return;
  const data = await resp.json();

  const container = document.getElementById('societies-list');
  const societies = data.societies || [];
  if (societies.length === 0) {
    container.innerHTML = '<div class="p-8 text-center text-gray-400">No societies found</div>';
    return;
  }
  container.innerHTML = societies.map(s => `
    <a href="/platform/societies/${s.id}" class="flex items-center justify-between px-5 py-4 hover:bg-gray-50 transition-colors">
      <div class="min-w-0 flex-1">
        <div class="font-medium text-gray-900">${s.name}</div>
        <div class="text-sm text-gray-500 mt-0.5">
          ${s.registrationNumber} &middot; ${s.city || 'N/A'} &middot; ${s.totalWings} wings, ${s.totalFlats} flats
        </div>
        <div class="text-xs text-gray-400 mt-1">${s.slug}</div>
      </div>
      <div class="flex items-center gap-3 ml-4">
        ${statusBadge(s.status)}
      </div>
    </a>
  `).join('');
}

(function() {
  if (!requireAuth()) return;
  filterSocieties('');
})();
</script>
{{end}}
